name: Application checks
on:
  pull_request:
    paths: ['backend/**', 'frontend/**', 'db/**', '.github/workflows/application-checks.yml']
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', 'db/**', '.github/workflows/application-checks.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
        env:
          MODERATION_TEST_DATABASE_URL: postgresql://postgres:ci-test-password@127.0.0.1:5432/postgres
          PROFILE_TEST_DATABASE_URL: postgresql://postgres:ci-test-password@127.0.0.1:5432/postgres
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
