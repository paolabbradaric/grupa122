<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cast me if you can — kompanija</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 480px;
      margin: 40px auto;
      padding: 20px;
    }

    label {
      display: block;
      margin-top: 16px;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      font: inherit;
    }

    button {
      margin-top: 24px;
      padding: 12px;
      font: inherit;
    }

    #result {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <h1>Cast me if you can</h1>
  <a href="/">Unos kandidata</a>

  <h2>Probni unos kompanije</h2>
  <p>
    Koristi izmišljene podatke. Kompanija nakon upisa čeka provjeru.
    Ovo nije prijava u račun.
  </p>

  <form id="company-form">
    <h3>Predstavnik kompanije</h3>

    <label>
      Ime
      <input name="first_name" required maxlength="100">
    </label>

    <label>
      Prezime
      <input name="last_name" required maxlength="100">
    </label>

    <label>
      E-adresa računa
      <input name="email" type="email" required maxlength="255">
    </label>

    <label>
      Datum rođenja
      <input name="birth_date" type="date" required>
    </label>

    <h3>Kompanija</h3>

    <label>
      Naziv kompanije
      <input name="company_name" required maxlength="200">
    </label>

    <label>
      Registracijski broj
      <input name="reg_num" required maxlength="50">
    </label>

    <label>
      Kontaktna e-adresa
      <input name="contact_email" type="email" required maxlength="255">
    </label>

    <button type="submit">Pošalji probni zahtjev</button>
  </form>

  <p id="result" role="status" aria-live="polite"></p>

  <script>
    const form = document.querySelector("#company-form");
    const button = form.querySelector("button");
    const result = document.querySelector("#result");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      button.disabled = true;
      result.textContent = "Spremanje…";

      try {
        // Prikuplja polja i šalje ih backendu.
        const data = Object.fromEntries(new FormData(form));

        const response = await fetch("/dev/companies", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(data),
        });

        const saved = await response.json();

        result.textContent = response.ok
          ? `${saved.message} ID kompanije: ${saved.organisation_id}. Status: na čekanju.`
          : saved.message;
      } catch {
        result.textContent =
          "Veza nije uspjela. Provjeri radi li backend.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
