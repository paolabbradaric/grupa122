<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cast me if you can — probni unos</title>
  <a href="/company">Unos kompanije</a>

  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 480px;
      margin: 40px auto;
      padding: 20px;
    }

    label {
      display: block;
      margin-top: 16px;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      font: inherit;
    }

    button {
      margin-top: 24px;
      padding: 12px;
      font: inherit;
    }

    #result {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <h1>Cast me if you can</h1>
  <h2>Probni unos kandidata</h2>
  <p>
    Lokalna provjera spremanja profila. Koristi izmišljene podatke.
    Ovo nije prijava u račun.
  </p>

  <form id="candidate-form">
    <label>
      Ime
      <input name="first_name" required maxlength="100">
    </label>

    <label>
      Prezime
      <input name="last_name" required maxlength="100">
    </label>

    <label>
      E-adresa
      <input
        name="email"
        type="email"
        required
        maxlength="255"
        placeholder="kandidat2@example.invalid"
      >
    </label>

    <label>
      Datum rođenja
      <input name="birth_date" type="date" required>
    </label>

    <label>
      Grad
      <input name="city" required maxlength="100">
    </label>

    <button type="submit">Spremi probnog kandidata</button>
  </form>

  <p id="result" role="status" aria-live="polite"></p>

  <script>
    const form = document.querySelector("#candidate-form");
    const button = form.querySelector("button");
    const result = document.querySelector("#result");

    form.addEventListener("submit", async (event) => {
      // Sprječava ponovno učitavanje stranice.
      event.preventDefault();

      button.disabled = true;
      result.textContent = "Spremanje…";

      try {
        // Pretvara polja obrasca u objekt.
        const data = Object.fromEntries(new FormData(form));

        // Šalje podatke backendu kao JSON.
        const response = await fetch("/dev/candidates", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(data),
        });

        const saved = await response.json();

        // Prikazuje potvrdu ili poruku o grešci.
        result.textContent = response.ok
          ? `${saved.message} ID korisnika: ${saved.user_id}; ID profila: ${saved.profile_id}.`
          : saved.message;
      } catch {
        result.textContent =
          "Veza nije uspjela. Provjeri terminal i radi li backend.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
