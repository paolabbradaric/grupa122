<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cast Me If You Can - Moji oglasi</title>
    <link rel="stylesheet" href="../assets/css/poslodavac.css"> 
</head>
<body>

    <!--Zaglavlje-->
    <header>
        <a href="poslodavac-moji-oglasi.html" class="logo">
            Cast Me If You Can
        </a>
        <nav>
            <a href="poslodavac-moji-oglasi.html">Moji oglasi</a>
            <a href="poslodavac-novi-oglas.html">Novi oglas</a>
            <a href="poslodavac-statistika.html">Statistika</a>
        </nav>
        <!--kasnije povezati sa prijavljenim korisnikom, kor. ime, izbornik s opcijama...-->
        <div class="korisnik">
            <span>Poslodavac</span>
        </div>
    </header>

    <!--Glavni dio-->
    <main class="container">

        <!--Naslov-->
        <section class="naslov-stranice">
            <div>
                <h1>Moji oglasi</h1>
                <p>
                    Ovdje možete pregledavati i upravljati
                    svojim casting oglasima.
                </p>
            </div>

            <a href="poslodavac-novi-oglas.html" class="gumb">
                + Novi oglas
            </a>
        </section>

    
        <!--Pretraživanje mojih oglasa-->
        <section class="pretrazivanje">

            <label for="pretraga-oglasa">Pretraži svoje oglase</label>

            <input
                type="search"
                id="pretraga-oglasa"
                placeholder="Upišite naziv projekta ili uloge..."
            >

        </section>

        <!--Filtriranje po statusu oglasa (dodati)-->

        <!--Popis mojih oglasa-->
        <section class="oglasi">

            <h2>Popis oglasa</h2>

            <!--JS će ovdje umetati oglase-->
            <div id="listaOglasa" class="lista-oglasa">

                <p id="porukaOglasi">
                    Trenutačno nemate oglasa za prikaz.
                </p>

            </div>

        </section>

    </main>

    <!--Fiksni gumb za novi oglas-->
    <a href="poslodavac-novi-oglas.html" class="novi-oglas-gumb-fiksni">
        + Novi oglas
    </a>

    <!--dodati script, JS-->
    
</body>
</html>
